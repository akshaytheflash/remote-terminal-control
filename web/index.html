<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>remoteterminal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d10'/%3E%3Cpath d='M8 11l6 5-6 5' stroke='%237ee787' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M17 21h7' stroke='%23e6edf3' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="login" class="screen">
  <form id="login-form" class="card" autocomplete="off">
    <div class="brand">remote<span>terminal</span></div>
    <p class="hint">enter the one-time password shown on your computer</p>
    <input id="password" type="text" inputmode="text" autocapitalize="characters"
           autocomplete="off" autocorrect="off" spellcheck="false"
           placeholder="XXXX-XXXX" aria-label="one-time password">
    <button type="submit" id="login-btn">connect</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>
</div>

<div id="term-screen" class="screen hidden">
  <header id="bar">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">connecting</span>
    <div class="spacer"></div>
    <button id="font-down" title="smaller text" aria-label="smaller text">A−</button>
    <button id="font-up" title="larger text" aria-label="larger text">A+</button>
    <button id="reconnect" title="reconnect" aria-label="reconnect">↻</button>
    <button id="logout" title="sign out" aria-label="sign out">⏻</button>
  </header>

  <div id="terminal"></div>

  <div id="keys">
    <button data-send="esc">esc</button>
    <button data-send="tab">tab</button>
    <button data-mod="ctrl" id="ctrl-key">ctrl</button>
    <button data-send="up">↑</button>
    <button data-send="down">↓</button>
    <button data-send="left">←</button>
    <button data-send="right">→</button>
    <button data-send="enter">↵</button>
    <button data-send="ctrlc">^C</button>
    <button data-mod="alt" id="alt-key">alt</button>
    <button id="paste">paste</button>
    <button id="kbd" title="show keyboard" aria-label="show keyboard">⌨</button>
  </div>

  <div id="ended" class="hidden">
    <p>session ended</p>
    <button id="ended-close">dismiss</button>
  </div>
</div>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/app.js"></script>
</body>
</html>
